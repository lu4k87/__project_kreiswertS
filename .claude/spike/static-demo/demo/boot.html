<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KreiswertS – static demo</title>
<body style="font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0">
<p id="status" role="status">Preparing the demo in your browser …</p>
<script>
  const base = "__BASE__";
  const next = new URLSearchParams(location.search).get("next");
  const target = next && next.startsWith(base + "/") ? next : base + "/";
  const status = document.getElementById("status");
  if (!("serviceWorker" in navigator) || !("cookieStore" in window)) status.textContent = "This browser cannot run the static demo (service worker and Cookie Store needed).";
  else navigator.serviceWorker.register(base + "/sw.js", { scope: base + "/" })
    .then(() => navigator.serviceWorker.ready)
    .then(() => new Promise((resolve) => navigator.serviceWorker.controller ? resolve() : navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true })))
    .then(() => location.replace(target))
    .catch((error) => { status.textContent = "The demo could not start: " + error.message; });
</script>
